<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nightbloom planner logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1638"/>
      <stop offset="100%" stop-color="#1c2f6e"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#26408c"/>
      <stop offset="100%" stop-color="#1c2f6e"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7fa6"/>
      <stop offset="100%" stop-color="#ff9d5c"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b48cff"/>
      <stop offset="50%" stop-color="#ff7fa6"/>
      <stop offset="100%" stop-color="#ff9d5c"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background. Corner rounding is cosmetic for standalone/
       favicon use — iOS applies its own squircle mask on top of this
       when the icon is added to a home screen, ignoring any transparency
       or rounding baked into the source image. -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#bgGrad)"/>

  <!-- Calendar / planner "page" -->
  <rect x="106" y="96" width="300" height="320" rx="48" fill="url(#cardGrad)"/>

  <!-- Header strip (rounded top corners only, matching the card) -->
  <path d="M154,96 H358 A48,48 0 0 1 406,144 V160 H106 V144 A48,48 0 0 1 154,96 Z"
        fill="url(#headerGrad)"/>

  <!-- Spiral-binder tabs -->
  <rect x="173" y="76" width="16" height="44" rx="8" fill="#b48cff"/>
  <rect x="323" y="76" width="16" height="44" rx="8" fill="#b48cff"/>

  <!-- Day markers -->
  <circle cx="172" cy="200" r="11" fill="#b48cff"/>
  <circle cx="256" cy="200" r="11" fill="#ff9d5c"/>
  <circle cx="340" cy="200" r="11" fill="#ff7fa6"/>

  <!-- Bold checklist checkmark, the focal shape -->
  <path d="M162,304 L228,372 L372,214"
        fill="none" stroke="url(#checkGrad)" stroke-width="38"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
